name: Backend and Frontend CI

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven and Run Tests
        working-directory: backend/sky-take-out
        run: mvn -B clean verify

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/admin-vue

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: frontend/admin-vue/package-lock.json

      - name: Use npm 10 baseline
        run: npm install --global npm@10.9.2

      - name: Clean install
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Run unit tests
        run: npm run test:unit -- --runInBand

      - name: Lint without modifying files
        run: npm run lint -- --no-fix

      - name: Build production bundle
        run: npm run build
